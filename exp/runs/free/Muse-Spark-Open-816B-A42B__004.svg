<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='640' viewBox='0 0 1280 640'><rect width='1280' height='640' fill='white'/><text x='640' y='90' text-anchor='middle' font-family='Arial, sans-serif' font-size='28' font-weight='bold' fill='black'>TO FIND THE PRICE MEASURE THE WIDTH OF THE RED BAR IN PIXELS</text><text x='640' y='130' text-anchor='middle' font-family='Arial, sans-serif' font-size='28' font-weight='bold' fill='black'>AND DIVIDE BY 100</text><rect x='550' y='270' width='180' height='50' fill='#FF0000' stroke='none' shape-rendering='crispEdges'/><text x='640' y='380' text-anchor='middle' font-family='Arial, sans-serif' font-size='18' fill='black'>Red bar width / 100 = price</text></svg>