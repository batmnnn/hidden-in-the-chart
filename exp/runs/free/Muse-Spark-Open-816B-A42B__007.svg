<svg width='1280' height='640' viewBox='0 0 1280 640' xmlns='http://www.w3.org/2000/svg'><rect width='1280' height='640' fill='white'/><text x='640' y='80' text-anchor='middle' font-family='Arial, sans-serif' font-size='38' font-weight='700' fill='#222222'>Weekly Market Price Board</text><text x='640' y='120' text-anchor='middle' font-family='Arial, sans-serif' font-size='20' fill='#555555'>Red marker shows current price on linear scale from 1.0 to 3.0</text><line x1='200' y1='320' x2='1080' y2='320' stroke='#222222' stroke-width='6' stroke-linecap='square'/><line x1='200' y1='300' x2='200' y2='340' stroke='#222222' stroke-width='4'/><line x1='288' y1='310' x2='288' y2='330' stroke='#222222' stroke-width='3'/><line x1='376' y1='310' x2='376' y2='330' stroke='#222222' stroke-width='3'/><line x1='464' y1='310' x2='464' y2='330' stroke='#222222' stroke-width='3'/><line x1='552' y1='310' x2='552' y2='330' stroke='#222222' stroke-width='3'/><line x1='640' y1='300' x2='640' y2='340' stroke='#222222' stroke-width='4'/><line x1='728' y1='310' x2='728' y2='330' stroke='#222222' stroke-width='3'/><line x1='816' y1='310' x2='816' y2='330' stroke='#222222' stroke-width='3'/><line x1='904' y1='310' x2='904' y2='330' stroke='#222222' stroke-width='3'/><line x1='992' y1='310' x2='992' y2='330' stroke='#222222' stroke-width='3'/><line x1='1080' y1='300' x2='1080' y2='340' stroke='#222222' stroke-width='4'/><text x='200' y='372' text-anchor='middle' font-family='Arial, sans-serif' font-size='30' font-weight='600' fill='#000000'>1.0</text><text x='640' y='372' text-anchor='middle' font-family='Arial, sans-serif' font-size='30' font-weight='600' fill='#000000'>2.0</text><text x='1080' y='372' text-anchor='middle' font-family='Arial, sans-serif' font-size='30' font-weight='600' fill='#000000'>3.0</text><text x='200' y='400' text-anchor='middle' font-family='Arial, sans-serif' font-size='16' fill='#666666'>left end</text><text x='1080' y='400' text-anchor='middle' font-family='Arial, sans-serif' font-size='16' fill='#666666'>right end</text><circle cx='816' cy='320' r='20' fill='#e60000' stroke='#000000' stroke-width='3'/><text x='816' y='272' text-anchor='middle' font-family='Arial, sans-serif' font-size='20' font-weight='700' fill='#e60000'>▼ PRICE</text><text x='640' y='520' text-anchor='middle' font-family='Arial, sans-serif' font-size='18' fill='#444444'>Measure center of red dot between ends to read price — left = 1.0, right = 3.0</text><text x='640' y='545' text-anchor='middle' font-family='Arial, sans-serif' font-size='16' fill='#777777'>Price = 1.0 + (x - 200) / 880 * 2.0</text></svg>