<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg"><rect width="1280" height="640" fill="white"/><text x="640" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="black">Weekly Market Price Indicator</text><text x="640" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="black">Price per unit — linear scale from 0 to 3</text><rect x="190" y="318" width="900" height="4" fill="black"/><rect x="189" y="305" width="2" height="30" fill="black"/><rect x="489" y="305" width="2" height="30" fill="black"/><rect x="789" y="305" width="2" height="30" fill="black"/><rect x="1089" y="305" width="2" height="30" fill="black"/><text x="190" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="black">0</text><text x="490" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="black">1</text><text x="790" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="black">2</text><text x="1090" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="black">3</text><polygon points="610,320 595,285 625,285" fill="#FF0000"/><text x="610" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FF0000">Today's price</text><rect x="190" y="420" width="900" height="30" fill="none" stroke="black" stroke-width="2"/><rect x="190" y="420" width="420" height="30" fill="#FF0000"/><text x="640" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black">How to read: price = (x of red tip - 190) / 900 * 3  (900 px = distance from 0 to 3)</text><text x="640" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="black">Same value from right edge of red bar — scale is linear</text><text x="640" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333333">Red triangle and red bar show today's price on the scale</text></svg>