arker</text></g><text x='640' y='575' text-anchor='middle' font-family='monospace' font-size='11' fill='#616161'>Decode: price = 1.0 + (X - 140) / 500  where X is red center X-coord</text><text x='640' y='605' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#9E9E9E'>Stall open 8am–6pm • All prices per kg • Thank you for visiting</text></svg>