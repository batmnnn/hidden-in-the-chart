<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='640' viewBox='0 0 1280 640'><rect width='1280' height='640' fill='white'/><rect x='40' y='40' width='1200' height='560' fill='none' stroke='black' stroke-width='2'/><text x='640' y='75' text-anchor='middle' font-family='Arial,sans-serif' font-size='36' font-weight='bold' fill='black'>Weekly Market Price Board</text><text x='640' y='120' text-anchor='middle' font-family='Arial,sans-serif' font-size='26' fill='black'>How to read: Count the blue circles, divide count by 10 = price</text><circle cx='100' cy='300' r='32' fill='#0d47a1'/><circle cx='198' cy='300' r='32' fill='#0d47a1'/><circle cx='296' cy='300' r='32' fill='#0d47a1'/><circle cx='394' cy='300' r='32' fill='#0d47a1'/><circle cx='492' cy='300' r='32' fill='#0d47a1'/><circle cx='590' cy='300' r='32' fill='#0d47a1'/><circle cx='688' cy='300' r='32' fill='#0d47a1'/><circle cx='786' cy='300' r='32' fill='#0d47a1'/><circle cx='884' cy='300' r='32' fill='#0d47a1'/><circle cx='982' cy='300' r='32' fill='#0d47a1'/><circle cx='1080' cy='300' r='32' fill='#0d47a1'/><circle cx='1178' cy='300' r='32' fill='#0d47a1'/><text x='640' y='480' text-anchor='middle' font-family='Arial,sans-serif' font-size='22' fill='black'>Example: 10 circles = 1.0 , 20 circles = 2.0</text><text x='640' y='520' text-anchor='middle' font-family='Arial,sans-serif' font-size='18' fill='#333333'>Count all blue circles shown above</text></svg>